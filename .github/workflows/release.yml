name: Build & Release APK

on:
  push:
    branches: [main]
    # 只改說明文件不用發新版（不然 App 會跳出沒有內容的更新）
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks

      - name: Build release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SIGNING_STORE_FILE: keystore/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :tablet:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk H1TV.apk
          cp tablet/build/outputs/apk/release/tablet-release.apk H1TVPad.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: H1TV v1.0.${{ github.run_number }}
          make_latest: true
          # 先只放 H1TV.apk 建立 Release，平板版下一步再補上。
          # 舊版電視 App（v1.0.5）更新時抓的是第一個 .apk，而 GitHub 依檔名排序，
          # 所以平板版檔名必須排在 H1TV.apk 後面（H1TVPad.apk）
          files: H1TV.apk
          # 更新說明就是 commit 訊息
          body: |
            ${{ github.event.head_commit.message }}

            ---
            固定下載網址（永遠是最新版）：
            電視版：https://github.com/${{ github.repository }}/releases/latest/download/H1TV.apk
            平板／手機版：https://github.com/${{ github.repository }}/releases/latest/download/H1TVPad.apk

            Downloader 下載碼（電視版）：3011797

      - name: Attach tablet APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: H1TVPad.apk
